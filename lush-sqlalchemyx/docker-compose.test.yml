services:
  mysql57:
    image: ${LUSH_TEST_MYSQL57_IMAGE:-mysql:5.7}
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lush_test}
    ports:
      - "33057:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-testpass}", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 45
    tmpfs:
      - /var/lib/mysql

  mysql8:
    image: ${LUSH_TEST_MYSQL8_IMAGE:-mysql:8.0.40-debian}
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lush_test}
    ports:
      - "33080:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-testpass}", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 45
    tmpfs:
      - /var/lib/mysql
