name: Test lush-sqlalchemyx

on:
  push:
    paths:
      - "lush-sqlalchemyx/**"
      - ".github/workflows/test-lush-sqlalchemyx.yaml"
  pull_request:
    paths:
      - "lush-sqlalchemyx/**"
      - ".github/workflows/test-lush-sqlalchemyx.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + SQLite suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lush-sqlalchemyx
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-suffix: sqlalchemyx-unit
      - name: Sync
        run: uv sync -p 3.10 --frozen --default-index https://pypi.org/simple
      - name: Test (coverage gate)
        run: uv run -p 3.10 --default-index https://pypi.org/simple pytest
        env:
          # 默认 suite 以 SQLite 为主; MySQL container 测试在 matrix job
          LUSH_TEST_MYSQL_IMAGE: mysql:8.0.40-debian
          LUSH_TEST_MYSQL_PULL: "1"

  mysql-matrix:
    name: MySQL ${{ matrix.mysql_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql_label: "5.7"
            image: mysql:5.7
            marker_expr: "TestMysql57ZeroDateReproduction"
          - mysql_label: "8.0"
            image: mysql:8.0.40-debian
            marker_expr: "TestMysql8StrictNoneDatetime"
    defaults:
      run:
        working-directory: lush-sqlalchemyx
    env:
      LUSH_TEST_MYSQL_PULL: "1"
      LUSH_TEST_MYSQL57_IMAGE: mysql:5.7
      LUSH_TEST_MYSQL8_IMAGE: mysql:8.0.40-debian
      LUSH_TEST_MYSQL_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-suffix: sqlalchemyx-mysql-${{ matrix.mysql_label }}
      - name: Sync
        run: uv sync -p 3.10 --frozen --default-index https://pypi.org/simple
      - name: Pull MySQL image
        run: docker pull "${{ matrix.image }}"
      - name: Matrix integration tests (sync + async)
        run: |
          set -euo pipefail
          uv run -p 3.10 --default-index https://pypi.org/simple \
            pytest "tests/test_mysql_update_none_datetime.py::${{ matrix.marker_expr }}" \
            -v --tb=short --no-cov
